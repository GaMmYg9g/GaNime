<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GaNime">
    <meta name="description" content="Catálogo de animes, series y películas">
    
    <title>GaNime</title>
    
    <!-- 🔥 CORREGIDO: Ruta absoluta con /GaNime/ -->
    <link rel="manifest" href="/GaNime/manifest.json">
    <link rel="apple-touch-icon" href="/GaNime/icons/icono.jpg">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/GaNime/css/styles.css">
    <link rel="stylesheet" href="/GaNime/css/temas.css">    
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <span class="logo-icon" id="logoIcon">⚡</span>
            <span class="logo-text">GaNime</span>
        </div>
        <div class="header-stats">
            <span class="header-count" id="totalCount"><i class="fas fa-database"></i> <span id="totalNumber">0</span></span>
            <button class="header-btn notif-btn" id="notifBtn" onclick="toggleNotificaciones()" title="Notificaciones">
                <i class="fas fa-bell"></i>
                <span class="notif-dot" id="notifDot"></span>
            </button>
            <button class="header-btn info-btn" onclick="toggleInfo()" title="Información">
                <i class="fas fa-info-circle"></i>
                <span class="notif-dot" id="infoBadge"></span>
            </button>
            <button class="header-btn tema-btn" onclick="toggleTemas()" title="Temas">
                <i class="fas fa-palette"></i>
            </button>
            <button class="header-btn cart-btn" onclick="toggleCarrito()" title="Carrito">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <!-- BUSCADOR -->
    <div class="search-box" id="searchBox">
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="🔎 Escriba algo para buscar..." autofocus>
            <button class="search-clear" id="searchClear" onclick="limpiarBusqueda()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <!-- OVERLAY DE BÚSQUEDA -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-overlay-content">
            <div class="search-overlay-icon">
                <i class="fas fa-search"></i>
            </div>
            <div class="search-overlay-title" id="searchOverlayTitle">Buscando Anime...</div>
            <div class="search-suggestions" id="searchSuggestions"></div>
        </div>
    </div>

    <!-- FILTROS -->
    <div class="filters" id="filtersContainer">
        <div class="filters-scroll" id="filtersScroll">
            <button class="filter-chip active" data-filter="todos" data-value="todos">Todos</button>
            <button class="filter-chip" data-filter="recientes" data-value="recientes">Recientes</button>
            <button class="filter-chip" data-filter="orden" data-value="az">Ordenar #-Z</button>
            <button class="filter-chip" data-filter="fecha" data-value="fecha-aFecha>Año ↑</button>
            <button class="filter-chip" data-filter="puntuacion" data-value="puntuacion-desc">⭐ ↓</button>
            <button class="filter-chip" data-filter="tipo" data-value="serie">Series</button>
            <button class="filter-chip" data-filter="tipo" data-value="película">Películas</button>
            <button class="filter-chip" data-filter="tipo" data-value="ova">OVA</button>
            <button class="filter-chip" data-filter="tipo" data-value="especial">Especiales</button>
            <button class="filter-chip" data-filter="tipo" data-value="ona">ONA</button>
        </div>
    </div>

    <!-- RESULTADOS STATS -->
    <div class="result-stats" id="resultStats"></div>

    <!-- GRID -->
    <div class="grid" id="grid"></div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)cerrarModal()">
        <div class="modal" id="modalContent"></div>
    </div>

    <!-- CARRITO -->
    <div class="cart-backdrop" id="cartBackdrop" onclick="toggleCarrito()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2><i class="fas fa-shopping-cart"></i> Pedidos</h2>
            <button onclick="toggleCarrito()"><i class="fas fa-times"></i></button>
        </div>
        <div id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-totals" id="cartTotals">
                <div class="cart-total-line" id="cartPesoLine" style="font-size:14px; color:var(--text2);">
                    <span>Peso total:</span>
                    <span id="cartPesoTotal">0 GB</span>
                </div>
            </div>
            <button class="btn-vaciar-carrito" onclick="vaciarCarrito()">
                <i class="fas fa-trash"></i> Vaciar pedido
            </button>
            <button class="cart-whatsapp" onclick="enviarWhatsApp()">
                <i class="fab fa-whatsapp"></i> Enviar pedido
            </button>
        </div>
    </div>

    <!-- NOTIFICACIONES PANEL -->
    <div class="notif-panel" id="notifPanel">
        <div class="notif-header">
            <h3><i class="fas fa-bell"></i> Notificaciones</h3>
            <button onclick="cerrarNotificaciones()"><i class="fas fa-times"></i></button>
        </div>
        <div class="notif-list" id="notifList">
            <div class="notif-empty">No hay notificaciones</div>
        </div>
    </div>
    <div class="notif-backdrop" id="notifBackdrop" onclick="cerrarNotificaciones()"></div>

    <!-- INFO PANEL -->
    <div class="info-panel" id="infoPanel">
        <div class="info-header">
            <h3><i class="fas fa-info-circle"></i> Información</h3>
            <button onclick="cerrarInfo()"><i class="fas fa-times"></i></button>
        </div>
        <div class="info-content" id="infoContent"></div>
    </div>
    <div class="info-backdrop" id="infoBackdrop" onclick="cerrarInfo()"></div>

    <!-- PANEL DE TEMAS -->
    <div class="temas-panel" id="temasPanel">
        <div class="temas-header">
            <h3><i class="fas fa-palette"></i> Temas</h3>
            <button onclick="cerrarTemas()"><i class="fas fa-times"></i></button>
        </div>
        <div class="temas-grid">
            <button class="tema-opcion" data-tema="auto">
                <span class="tema-icono"><i class="fas fa-sync-alt"></i></span>
                <span class="tema-nombre">Automático</span>
            </button>
            <button class="tema-opcion" data-tema="original">
                <span class="tema-icono"><i class="fas fa-bolt"></i></span>
                <span class="tema-nombre">Original</span>
            </button>
            <button class="tema-opcion" data-tema="claro">
                <span class="tema-icono">✨</span>
                <span class="tema-nombre">Claro</span>
            </button>
            <button class="tema-opcion" data-tema="oscuro">
                <span class="tema-icono"><i class="fas fa-moon"></i></span>
                <span class="tema-nombre">Oscuro</span>
            </button>
            <button class="tema-opcion" data-tema="primavera">
                <span class="tema-icono"><i class="fas fa-seedling"></i></span>
                <span class="tema-nombre">Primavera</span>
            </button>
            <button class="tema-opcion" data-tema="verano">
                <span class="tema-icono"><i class="fas fa-sun"></i></span>
                <span class="tema-nombre">Verano</span>
            </button>
            <button class="tema-opcion" data-tema="otono">
                <span class="tema-icono"><i class="fas fa-leaf"></i></span>
                <span class="tema-nombre">Otoño</span>
            </button>
            <button class="tema-opcion" data-tema="invierno">
                <span class="tema-icono"><i class="fas fa-snowflake"></i></span>
                <span class="tema-nombre">Invierno</span>
            </button>
            <button class="tema-opcion" data-tema="halloween">
                <span class="tema-icono"><i class="fas fa-ghost"></i></span>
                <span class="tema-nombre">Halloween</span>
            </button>
            <button class="tema-opcion" data-tema="navidad">
                <span class="tema-icono"><i class="fas fa-tree"></i></span>
                <span class="tema-nombre">Navidad</span>
            </button>
            <button class="tema-opcion" data-tema="fin-de-ano">
                <span class="tema-icono">🏮<i class="fas fa-fireworks"></i></span>
                <span class="tema-nombre">Fin de Año</span>
            </button>
        </div>
    </div>
    <div class="temas-backdrop" id="temasBackdrop" onclick="cerrarTemas()"></div>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMsg"></span>
    </div>

    <!-- SCRIPTS -->
    <!-- 🔥 CORREGIDOS: Todas las rutas con /GaNime/ -->
    <script src="/GaNime/js/config.js"></script>
    <script src="/GaNime/js/sonidos.js"></script>
    <script src="/GaNime/js/data/data.js"></script>
    <script src="/GaNime/js/data/data2.js"></script>
    <script src="/GaNime/js/data/data3.js"></script>
    <script src="/GaNime/js/data/data4.js"></script>
    <script src="/GaNime/js/notificaciones.js"></script>
    <script src="/GaNime/js/info.js"></script>
    <script src="/GaNime/js/app.js"></script>
    <script src="/GaNime/js/temas.js"></script>

    <script>
        // ===== SERVICE WORKER - CORREGIDO =====
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/GaNime/sw.js')
                    .then((registration) => {
                        console.log('✅ Service Worker registrado correctamente');
                    })
                    .catch((error) => {
                        console.log('❌ Error al registrar Service Worker:', error);
                    });
            });
        }

        if (window.matchMedia('(display-mode: standalone)').matches) {
            console.log('📱 GaNime ejecutándose como PWA instalada');
        }
    </script>
</body>
</html>
